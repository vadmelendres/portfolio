<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #e0e0e0;
        }

        header {
            background: rgba(20, 20, 20, 0.95);
            padding: 3rem 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1877f2 0%, #0a66c2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 1.1rem;
            color: #b0b0b0;
            margin-bottom: 1.5rem;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #1877f2 0%, #0a66c2 100%);
            color: white;
            padding: 0.9rem 2.2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(24, 119, 242, 0.25);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(24, 119, 242, 0.35);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(24, 119, 242, 0.3);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .video-card {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 2rem;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: block;
            cursor: pointer;
        }

        .video-card:hover {
            border-color: rgba(24, 119, 242, 0.5);
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(24, 119, 242, 0.15);
        }

        .video-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .video-stats {
            font-size: 1rem;
            color: #888;
            margin-bottom: 1.5rem;
        }

        .view-count {
            font-weight: 600;
            color: #1877f2;
        }

        .good-badge {
            background: linear-gradient(135deg, #1877f2 0%, #0a66c2 100%);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-left: 0.5rem;
        }

        .watch-button {
            background: linear-gradient(135deg, #1877f2 0%, #0a66c2 100%);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .video-card:hover .watch-button {
            transform: scale(1.05);
        }

        .video-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
        }

        .video-modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 12px;
            padding: 2rem;
        }

        .close-modal {
            position: absolute;
            right: 1.5rem;
            top: 1.5rem;
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            color: #1877f2;
            transform: scale(1.2);
        }

        .video-embed-container {
            width: 100%;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .video-embed-container iframe {
            max-width: 100%;
            border-radius: 8px;
        }

        .modal-video-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .modal-video-stats {
            color: #888;
            font-size: 1rem;
        }

        .open-facebook-button {
            display: inline-block;
            background: linear-gradient(135deg, #1877f2 0%, #0a66c2 100%);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }

        .open-facebook-button:hover {
            transform: translateY(-2px);
        }

        footer {
            background: rgba(20, 20, 20, 0.95);
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>

        function openModal(video) {
            document.getElementById('modalTitle').textContent = video.title;
            document.getElementById('modalStats').textContent = `${video.viewCount.toLocaleString()} views`;
            document.getElementById('openFacebookBtn').href = video.facebookLink;
            
            const embedContainer = document.getElementById('videoEmbedContainer');
            embedContainer.innerHTML = `<iframe src="https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(video.facebookLink)}&width=500&show_text=false" width="500" height="590" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`;
            
            document.getElementById('videoModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('videoModal').classList.remove('active');
            document.getElementById('videoEmbedContainer').innerHTML = '';
        }

        function createVideoCard(video) {
            const isGood = video.viewCount >= 1000;
            
            const card = document.createElement('button');
            card.className = 'video-card';
            card.type = 'button';
            card.style.cursor = 'pointer';
            card.style.border = 'none';
            card.style.background = 'rgba(30, 30, 30, 0.8)';
            card.onclick = () => openModal(video);

            card.innerHTML = `
                <h3 class="video-title">${video.title}</h3>
                <div class="video-stats">
                    <span class="view-count">${video.viewCount.toLocaleString()} views</span>
                    ${isGood ? '<span class="good-badge">✓ Good</span>' : ''}
                </div>
                <span class="watch-button">Watch Video →</span>
            `;

            return card;
        }

        function renderPortfolio() {
            if (videos.length === 0) {
                document.getElementById('good-videos').innerHTML = '<p style="text-align: center; color: #666;">No videos yet!</p>';
                document.getElementById('all-videos').innerHTML = '<p style="text-align: center; color: #666;">No videos yet!</p>';
                return;
            }

            const sorted = [...videos].sort((a, b) => b.viewCount - a.viewCount);
            const goodVideos = sorted.filter(v => v.viewCount >= 1000);

            // Render good performing videos
            const goodContainer = document.getElementById('good-videos');
            if (goodVideos.length === 0) {
                goodContainer.innerHTML = '<p style="text-align: center; color: #666;">No good performing videos yet (1K+ views).</p>';
            } else {
                goodContainer.innerHTML = '';
                goodVideos.forEach(video => {
                    goodContainer.appendChild(createVideoCard(video));
                });
            }

            // Render all videos
            const allContainer = document.getElementById('all-videos');
            allContainer.innerHTML = '';
            sorted.forEach(video => {
                allContainer.appendChild(createVideoCard(video));
            });
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('videoModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        renderPortfolio();
