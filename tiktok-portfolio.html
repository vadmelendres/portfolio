<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Z Coworking - Video Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #e0e0e0;
        }

        header {
            background: rgba(20, 20, 20, 0.95);
            padding: 3rem 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8c42 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 1.1rem;
            color: #b0b0b0;
            margin-bottom: 1.5rem;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8c42 100%);
            color: white;
            padding: 0.9rem 2.2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.25);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 107, 107, 0.35);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(255, 107, 107, 0.3);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .video-card {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 2rem;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .video-card:hover {
            border-color: rgba(255, 107, 107, 0.5);
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.15);
        }

        .video-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .video-stats {
            font-size: 1rem;
            color: #888;
            margin-bottom: 1.5rem;
        }

        .view-count {
            font-weight: 600;
            color: #ff8c42;
        }

        .good-badge {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8c42 100%);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-left: 0.5rem;
        }

        .watch-button {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8c42 100%);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .video-card:hover .watch-button {
            transform: scale(1.05);
        }

        footer {
            background: rgba(20, 20, 20, 0.95);
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .video-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>StartUpz Coworking</h1>
        <p class="tagline">Video Content Portfolio</p>
        <a href="https://www.tiktok.com/@startupzcoworkingph" class="cta-button" target="_blank">View Full Profile on TikTok</a>
    </header>

    <main class="container">
        <section>
            <h2 class="section-title">⭐ Good Performing</h2>
            <div id="good-videos" class="video-grid"></div>
        </section>

        <section>
            <h2 class="section-title">All Videos</h2>
            <div id="all-videos" class="video-grid"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Startup Z Coworking. Videos by Vad.</p>
    </footer>

    <script>
        // ============================================
        // EDIT YOUR VIDEOS HERE
        // ============================================
        const videos = [
            {
                title: "8-7-26",
                tiktokLink: "https://www.tiktok.com/@startupzcoworkingph/video/7659992060459552008?is_from_webapp=1&sender_device=pc",
                viewCount: 276,
                date: "8-7-26"
            },
            {
                title: "Executive Desks & High-Speed WiFi",
                tiktokLink: "https://www.tiktok.com/@startupzcoworkingph/video/7660854512214707463?is_from_webapp=1&sender_device=pc",
                viewCount: 273,
                date: "10-8-26"
            }
            // TO ADD MORE VIDEOS, COPY THIS AND FILL IN YOUR INFO:
            // ,
            // {
            //     title: "Your Video Title",
            //     tiktokLink: "https://www.tiktok.com/@startupzcoworkingph/video/YOUR-VIDEO-ID",
            //     viewCount: 5000,
            //     date: "8-8-26"
            // }
        ];

        function createVideoCard(video) {
            const isGood = video.viewCount >= 1000;
            
            const card = document.createElement('a');
            card.href = video.tiktokLink;
            card.target = '_blank';
            card.className = 'video-card';

            card.innerHTML = `
                <h3 class="video-title">${video.title}</h3>
                <div class="video-stats">
                    <span class="view-count">${video.viewCount.toLocaleString()} views</span>
                    ${isGood ? '<span class="good-badge">✓ Good</span>' : ''}
                </div>
                <span class="watch-button">Watch Video →</span>
            `;

            return card;
        }

        function renderPortfolio() {
            if (videos.length === 0) {
                document.getElementById('good-videos').innerHTML = '<p style="text-align: center; color: #666;">No videos yet!</p>';
                document.getElementById('all-videos').innerHTML = '<p style="text-align: center; color: #666;">No videos yet!</p>';
                return;
            }

            const sorted = [...videos].sort((a, b) => b.viewCount - a.viewCount);
            const goodVideos = sorted.filter(v => v.viewCount >= 1000);

            // Render good performing videos
            const goodContainer = document.getElementById('good-videos');
            if (goodVideos.length === 0) {
                goodContainer.innerHTML = '<p style="text-align: center; color: #666;">No good performing videos yet (1K+ views).</p>';
            } else {
                goodContainer.innerHTML = '';
                goodVideos.forEach(video => {
                    goodContainer.appendChild(createVideoCard(video));
                });
            }

            // Render all videos
            const allContainer = document.getElementById('all-videos');
            allContainer.innerHTML = '';
            sorted.forEach(video => {
                allContainer.appendChild(createVideoCard(video));
            });
        }

        renderPortfolio();
    </script>
</body>
</html>
