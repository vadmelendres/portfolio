<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Z Coworking - Video Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #e0e0e0;
            line-height: 1.6;
        }

        header {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3rem 2rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8c42 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 1.1rem;
            color: #b0b0b0;
            margin-bottom: 1.5rem;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8c42 100%);
            color: white;
            padding: 0.9rem 2.2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.25);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(255, 107, 107, 0.35);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .section {
            margin-bottom: 5rem;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(255, 107, 107, 0.3);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .video-card {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .video-card:hover {
            border-color: rgba(255, 107, 107, 0.5);
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.15);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 177.78%;
            background: #000;
            overflow: hidden;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-info {
            padding: 1.3rem;
        }

        .video-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            line-height: 1.4;
            color: #ffffff;
        }

        .video-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #888;
        }

        .view-count {
            font-weight: 600;
            color: #ff8c42;
        }

        .viral-badge {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8c42 100%);
            color: white;
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: #666;
            grid-column: 1 / -1;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        footer {
            background: rgba(20, 20, 20, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            padding: 2rem;
            margin-top: 4rem;
            color: #666;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .section-title {
                font-size: 1.4rem;
            }

            .video-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 1.5rem;
            }

            header {
                padding: 2rem 1rem;
            }

            .container {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Startup Z Coworking</h1>
            <p class="tagline">Video Content Portfolio</p>
            <a href="https://www.tiktok.com/@startupzcoworkingph" class="cta-button" target="_blank">View Full Profile</a>
        </div>
    </header>

    <main class="container">
        <section class="section">
            <h2 class="section-title">⭐ Good Performing</h2>
            <div id="viral-videos" class="video-grid"></div>
        </section>

        <section class="section">
            <h2 class="section-title">All Videos</h2>
            <div id="all-videos" class="video-grid"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Startup Z Coworking. Videos by Vad.</p>
    </footer>

    <script>
        // ============================================
        // EDIT YOUR VIDEOS HERE
        // ============================================
        const videos = [
            {
                title: "1",
                tiktokLink: "https://www.tiktok.com/@startupzcoworkingph/video/7659992060459552008",
                viewCount: 276,
                date: "8-7-26"
            }
            // TO ADD MORE VIDEOS, COPY THIS BELOW AND FILL IN YOUR INFO:
            // ,
            // {
            //     title: "YOUR VIDEO TITLE",
            //     tiktokLink: "https://www.tiktok.com/@startupzcoworkingph/video/YOUR-VIDEO-ID",
            //     viewCount: 5000,
            //     date: "8-8-26"
            // }
        ];

        function extractTikTokId(url) {
            if (!url) return null;
            const match = url.match(/video\/(\d+)/);
            return match ? match[1] : null;
        }

        function createVideoCard(video) {
            const videoId = extractTikTokId(video.tiktokLink);
            if (!videoId) return null;

            const isViral = video.viewCount >= 10000;
            const card = document.createElement('div');
            card.className = 'video-card';

            card.innerHTML = `
                <div class="video-wrapper">
                    <iframe src="https://www.tiktok.com/embed/v2/${videoId}" width="100%" height="100%" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>
                <div class="video-info">
                    <h3 class="video-title">${video.title}</h3>
                    <div class="video-stats">
                        <span class="view-count">${video.viewCount.toLocaleString()} views</span>
                        ${isViral ? '<span class="viral-badge">Viral 🚀</span>' : ''}
                    </div>
                </div>
            `;

            return card;
        }

        function renderPortfolio() {
            if (videos.length === 0) {
                document.getElementById('viral-videos').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📹</div>
                        <p>No videos yet!</p>
                    </div>
                `;
                document.getElementById('all-videos').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📹</div>
                        <p>No videos yet!</p>
                    </div>
                `;
                return;
            }

            const sorted = [...videos].sort((a, b) => b.viewCount - a.viewCount);
            const viralVideos = sorted.filter(v => v.viewCount >= 1000);

            const viralContainer = document.getElementById('viral-videos');
            if (viralVideos.length === 0) {
                viralContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🌟</div>
                        <p>No good performing videos yet (1K+ views). Keep creating!</p>
                    </div>
                `;
            } else {
                viralContainer.innerHTML = '';
                viralVideos.forEach(video => {
                    const card = createVideoCard(video);
                    if (card) viralContainer.appendChild(card);
                });
            }

            const allContainer = document.getElementById('all-videos');
            allContainer.innerHTML = '';
            sorted.forEach(video => {
                const card = createVideoCard(video);
                if (card) allContainer.appendChild(card);
            });

            const script = document.createElement('script');
            script.src = 'https://www.tiktok.com/embed.js';
            document.body.appendChild(script);
        }

        window.addEventListener('load', renderPortfolio);
    </script>
</body>
</html>
